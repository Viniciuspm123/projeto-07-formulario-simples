<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="description" content="Foprmulário de contato simples, feito com as tcnologias HTML5 e CSS3">
    <meta name="keywords" content="Formulário,contato,simples">
    <meta name="author" content="Vinicius Marques">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulátio Simples</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section>
            <div class="form-container">

                <h2 class="form-title">Inscreva-se na Nossa Newsletter</h2>
                <p class="form-subtitle">Receba as últimas notícias e ofertas diretamente no seu e-mail.</p>

                <form>

                    <div class="form-group">
                        <label for="name">Nome</label>
                        <input type="text" id="name" name="user_name" placeholder="Seu nome completo">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="user_email" placeholder="seu.email@exemplo.com">
                    </div>

                    <div class="form-group">
                    <label for="">Digite Seu Texto</label>
                    <textarea></textarea>
                    </div>

                    <div class="form-group">
                        <label for="Telefone">Telefone</label>
                        <input type="mensagem" id="mensagem" name="user_mensagem" placeholder="(55) 5 5555-5555">
                    </div>

                    <form>
                        <input type="checkbox" id="termos" name="Termos" value="termos-e-condicoes">
                        <label for="termos">Eu aceito os termos e condições</label><br>
                    </form>

                    <button type="submit" class="submit-button">Inscrever</button>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
